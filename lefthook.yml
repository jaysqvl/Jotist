pre-commit:
  parallel: true
  commands:
    go-vet:
      glob: "**/*.go"
      run: make vet

    frontend-lint:
      root: "web/frontend/"
      glob: "**/*.{js,jsx,ts,tsx}"
      run: ./node_modules/.bin/eslint {staged_files}

    frontend-type-check:
      root: "web/frontend/"
      glob: "**/*.{ts,tsx}"
      run: npm run type-check
