# Jotist. Legacy service and volume names preserve existing deployments.
# Local source build for Blackwell evaluation; actual model inference is unqualified.
# Uses Dockerfile.cuda.13.0 for RTX 50-series (Blackwell architecture, sm_120)
# For CUDA 12.6-compatible GPUs, use docker-compose.build.cuda.yml instead
services:
  scriberr:
    build:
      context: .
      dockerfile: Dockerfile.cuda.13.0
    image: jotist:local-blackwell
    container_name: scriberr-blackwell
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Security: already set in container, but can be overridden
      - APP_ENV=production
      # CORS: comma-separated list of allowed origins for production
      # - ALLOWED_ORIGINS=https://your-domain.com
    volumes:
      - ./scriberr_data:/app/data
      - ./env-data:/app/whisperx-env
    restart: unless-stopped

volumes:
  scriberr_data:
  env-data:
