name: CI

on:
  push:
   branches: [ main ]
  pull_request:
  workflow_dispatch:


jobs:
  python-adapter-envs:
    name: python adapter envs (${{ matrix.python-version }}, ${{ matrix.torch-index }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        torch-index: ['cpu', 'cu126', 'cu130']
        include:
          - {python-version: '3.10', torch-index: cpu}
          - {python-version: '3.10', torch-index: cu126}
          - {python-version: '3.10', torch-index: cu130}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12' # Verifier uses tomllib; uv selects the target runtime below.

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Test runtime verifier policy
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Verify Python adapter resolver surfaces
        env:
          ADAPTER_PYTHON: ${{ matrix.python-version }}
          TORCH_INDEX: ${{ matrix.torch-index }}
        run: |
          adapters=()
          if [ "$ADAPTER_PYTHON" = "3.10" ]; then
            adapters=(--adapter pyannote)
          elif [ "$ADAPTER_PYTHON" = "3.11" ]; then
            # DiariZen requires Python 3.12 after the coordinated runtime update.
            for adapter in nvidia-asr canary-qwen pyannote whisperx suplime local-asr; do
              adapters+=(--adapter "$adapter")
            done
          fi
          python scripts/verify-python-adapter-envs.py --mode lock --python "$ADAPTER_PYTHON" --torch-index "$TORCH_INDEX" "${adapters[@]}"

  build:
    name: basics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate deployment configurations
        run: |
          for file in docker-compose.yml deploy/compose/*.yaml; do
            docker compose --project-directory . -f "$file" config --quiet
          done

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

    # frontend build and test steps
      - name: Install Frontend Dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Audit Frontend Dependencies
        working-directory: web/frontend
        run: npm audit

      - name: Run Frontend Tests
        working-directory: web/frontend
        run: npm test

      - name: Build Frontend
        working-directory: web/frontend
        run: npm run build

      - name: Run Frontend Lint
        working-directory: web/frontend
        run: npm run lint

      - name: Run Frontend Type Check
        working-directory: web/frontend
        run: npm run type-check

    # Backend
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Copy Frontend Assets
        run: make embed

      - name: Build Go Project
        run: go build -v ./cmd/... ./internal/... ./pkg/...

      - name: Vet Go Project
        run: go vet ./api-docs ./cmd/... ./internal/... ./pkg/... ./tests

      - name: Scan Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./cmd/... ./internal/... ./pkg/...

      - name: Run Go Tests
        run: go test -v ./api-docs ./cmd/... ./internal/... ./pkg/... ./tests

    # Project site
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: web/project-site/package-lock.json

      - name: Generate API documentation
        run: make docs

      - name: Install dependencies
        working-directory: web/project-site
        run: npm ci

      - name: Audit project site dependencies
        working-directory: web/project-site
        run: npm audit

      - name: Build project site
        working-directory: web/project-site
        run: npm run build

      - name: Run project site lint
        working-directory: web/project-site
        run: npm run lint

      # Fail if any changes were written to any source files or generated untracked files
      - run: git add -A && git diff --cached --exit-code
