name: CI

on:
  push:
   branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-adapter-envs:
    name: python adapter envs (${{ matrix.python-version }}, ${{ matrix.torch-index }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        torch-index: ['cpu', 'cu126', 'cu130']
        include:
          - {python-version: '3.10', torch-index: cpu}
          - {python-version: '3.10', torch-index: cu126}
          - {python-version: '3.10', torch-index: cu130}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12' # Verifier uses tomllib; uv selects the target runtime below.

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Test runtime verifier policy
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Verify Python adapter resolver surfaces
        env:
          ADAPTER_PYTHON: ${{ matrix.python-version }}
          TORCH_INDEX: ${{ matrix.torch-index }}
        run: |
          adapters=()
          if [ "$ADAPTER_PYTHON" = "3.10" ]; then
            adapters=(--adapter pyannote)
          elif [ "$ADAPTER_PYTHON" = "3.11" ]; then
            # DiariZen requires Python 3.12 after the coordinated runtime update.
            for adapter in nvidia-asr canary-qwen pyannote whisperx suplime local-asr; do
              adapters+=(--adapter "$adapter")
            done
          fi
          python scripts/verify-python-adapter-envs.py --mode lock --python "$ADAPTER_PYTHON" --torch-index "$TORCH_INDEX" "${adapters[@]}"

  build:
    name: basics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate deployment configurations
        run: |
          for file in docker-compose.yml deploy/compose/*.yaml; do
            docker compose --project-directory . -f "$file" config --quiet
          done

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

    # frontend build and test steps
      - name: Install Frontend Dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Audit Frontend Dependencies
        working-directory: web/frontend
        run: npm audit

      - name: Run Frontend Tests
        working-directory: web/frontend
        run: npm test

      - name: Build Frontend
        working-directory: web/frontend
        run: npm run build

      - name: Run Frontend Lint
        working-directory: web/frontend
        run: npm run lint

      - name: Run Frontend Type Check
        working-directory: web/frontend
        run: npm run type-check

    # Backend
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Copy Frontend Assets
        run: make embed

      - name: Build Go Project
        run: go build -v ./cmd/... ./internal/... ./pkg/...

      - name: Vet Go Project
        run: go vet ./api-docs ./cmd/... ./internal/... ./pkg/... ./tests

      - name: Scan Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./cmd/... ./internal/... ./pkg/...

      - name: Run Go Tests
        run: go test -race -count=1 ./api-docs ./cmd/... ./internal/... ./pkg/... ./tests

    # Project site
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: web/project-site/package-lock.json

      - name: Generate API documentation
        run: make docs

      - name: Install dependencies
        working-directory: web/project-site
        run: npm ci

      - name: Audit project site dependencies
        working-directory: web/project-site
        run: npm audit

      - name: Build project site
        working-directory: web/project-site
        run: npm run build

      - name: Run project site lint
        working-directory: web/project-site
        run: npm run lint

      # Fail if any changes were written to any source files or generated untracked files
      - run: git add -A && git diff --cached --exit-code

  browser:
    name: Browser, mobile and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install and build frontend
        working-directory: web/frontend
        run: npm ci && npm run build
      - name: Install test browser
        working-directory: web/frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise responsive UI and removal safety
        working-directory: web/frontend
        run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-qualification
          path: |
            web/frontend/playwright-report/
            web/frontend/test-results/
          retention-days: 14

  images:
    name: Image qualification
    uses: ./.github/workflows/image-validation.yml
    with:
      source_ref: ${{ github.event.pull_request.head.sha || github.sha }}

  python-imports:
    name: Installed Python runtime qualification
    uses: ./.github/workflows/python-adapter-imports.yml
    with:
      source_ref: ${{ github.event.pull_request.head.sha || github.sha }}

  required:
    name: Required checks
    if: always()
    needs: [build, python-adapter-envs, python-imports, browser, images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
