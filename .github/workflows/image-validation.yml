name: Qualify built image

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    name: Built ${{ matrix.variant }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Capture exact source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.variant }}
          load: true
          tags: jotist-ci:${{ matrix.variant }}
          build-args: |
            VERSION=ci
            COMMIT=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=qualification-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=qualification-${{ matrix.variant }}
      - name: Boot image and verify persistent writes and identities
        env:
          REVISION: ${{ steps.source.outputs.sha }}
          VARIANT: ${{ matrix.variant }}
        run: python3 scripts/smoke_container.py --image "jotist-ci:$VARIANT" --revision "$REVISION" --version ci --report "qualification/$VARIANT.json"
      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: jotist-ci:${{ matrix.variant }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: qualification/trivy-${{ matrix.variant }}.json
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-image-${{ matrix.variant }}
          path: qualification/
          retention-days: 14
