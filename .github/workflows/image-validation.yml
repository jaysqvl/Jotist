name: Qualify built image

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    name: Built ${{ matrix.variant }} image (${{ matrix.architecture }})
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: cpu, architecture: amd64}
          - {variant: cpu, architecture: arm64}
          - {variant: cuda, architecture: amd64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Require native architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 -c 'import os,platform; expected={"amd64":"x86_64","arm64":"aarch64"}[os.environ["EXPECTED_ARCHITECTURE"]]; assert platform.machine()==expected, "image qualification must run natively"'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Capture exact source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.variant }}
          pull: true
          no-cache-filters: runtime
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: jotist-ci:${{ matrix.variant }}
          build-args: |
            VERSION=ci
            COMMIT=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=qualification-${{ matrix.variant }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=qualification-${{ matrix.variant }}-${{ matrix.architecture }}
      - name: Boot image and verify persistent writes and identities
        env:
          REVISION: ${{ steps.source.outputs.sha }}
          VARIANT: ${{ matrix.variant }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 scripts/smoke_container.py --image "jotist-ci:$VARIANT" --revision "$REVISION" --version ci --architecture "$ARCHITECTURE" --report "qualification/$VARIANT.json"
      - name: Record unfiltered built image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: jotist-ci:${{ matrix.variant }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0' # The strict gate below applies the reviewed package scope.
          list-all-pkgs: true
          format: json
          output: qualification/trivy-${{ matrix.variant }}-raw.json
      - name: Enforce image vulnerability gate with verified package applicability
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 scripts/prepare_container_vex.py \
            --report "qualification/trivy-${VARIANT}-raw.json" --smoke "qualification/${VARIANT}.json" \
            --output qualification/kernel-headers.openvex.json
          trivy image "jotist-ci:${VARIANT}" --cache-dir .cache/trivy --skip-db-update \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed=false --exit-code 1 \
            --vex qualification/kernel-headers.openvex.json \
            --format json --output "qualification/trivy-${VARIANT}.json"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-image-${{ matrix.variant }}-${{ matrix.architecture }}
          path: qualification/
          retention-days: 14
