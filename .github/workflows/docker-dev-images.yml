name: Publish container images

# No tag-push trigger: legacy tag imports cannot publish images.
on:
  workflow_call:
    inputs:
      source_repository:
        description: Must be this repository.
        required: true
        type: string
      upstream_ref:
        description: Source branch, tag, or commit.
        required: true
        type: string
      image_channel:
        description: Container tag without a leading v.
        required: true
        type: string
      variants:
        default: cpu-cuda
        type: string
      publish_latest:
        default: false
        type: boolean
      validated_source_sha:
        description: Exact commit already validated by the calling release workflow; omit to run validation here.
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      source_repository:
        description: Must be this repository.
        required: true
        default: jaysqvl/Jotist
        type: string
      upstream_ref:
        description: Source branch, tag, or commit.
        required: true
        default: main
        type: string
      image_channel:
        description: Container tag without a leading v, such as 1.7.0.
        required: true
        default: preview
        type: string
      variants:
        required: true
        default: cpu-cuda
        type: choice
        options: [cpu-cuda, cpu, cuda, blackwell, all]
      publish_latest:
        description: Update latest only for a matching stable version tag.
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: jotist-images-${{ inputs.image_channel }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve immutable image source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      short_sha: ${{ steps.source.outputs.short_sha }}
      image_channel: ${{ steps.settings.outputs.image_channel }}
      matrix: ${{ steps.settings.outputs.matrix }}
      publish_latest: ${{ steps.source.outputs.publish_latest }}
      already_validated: ${{ steps.source.outputs.already_validated }}
    steps:
      - name: Validate build inputs
        id: settings
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          IMAGE_CHANNEL: ${{ inputs.image_channel }}
          VARIANTS: ${{ inputs.variants }}
        run: |
          if [[ "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Jotist images must be built from this repository."
            exit 1
          fi
          if [[ ! "$IMAGE_CHANNEL" =~ ^[a-z0-9_][a-z0-9_.-]{0,79}$ || "$IMAGE_CHANNEL" == latest ]]; then
            echo "::error::Use a lowercase version or preview channel, not latest."
            exit 1
          fi
          case "$VARIANTS" in all|cpu-cuda|cpu|cuda|blackwell) ;; *) exit 1 ;; esac
          matrix='[{"variant":"cpu","dockerfile":"deploy/docker/Dockerfile.cpu","legacy_dockerfile":"Dockerfile","suffix":""},{"variant":"cuda","dockerfile":"deploy/docker/Dockerfile.cuda","legacy_dockerfile":"Dockerfile.cuda","suffix":"-cuda"},{"variant":"blackwell","dockerfile":"deploy/docker/Dockerfile.blackwell","legacy_dockerfile":"Dockerfile.cuda.13.0","suffix":"-blackwell"}]'
          matrix="$(jq -c --arg variant "$VARIANTS" '{include: map(select($variant == "all" or .variant == $variant or ($variant == "cpu-cuda" and (.variant == "cpu" or .variant == "cuda"))))}' <<< "$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "image_channel=$IMAGE_CHANNEL" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.upstream_ref }}
          fetch-depth: 0

      - name: Guard source and stable aliases
        id: source
        shell: bash
        env:
          VALIDATED_SHA: ${{ inputs.validated_source_sha }}
          IMAGE_CHANNEL: ${{ steps.settings.outputs.image_channel }}
          INPUT_LATEST: ${{ inputs.publish_latest }}
        run: |
          sha="$(git rev-parse HEAD)"
          already_validated=false
          if [[ -n "$VALIDATED_SHA" ]]; then
            if [[ ! "$VALIDATED_SHA" =~ ^[0-9a-f]{40}$ || "$VALIDATED_SHA" != "$sha" ]]; then
              echo "::error::Image source differs from the validated release commit."
              exit 1
            fi
            already_validated=true
          fi
          latest=false
          if [[ "$INPUT_LATEST" == true && "$IMAGE_CHANNEL" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            test "$(git rev-parse "refs/tags/v${IMAGE_CHANNEL}^{commit}")" = "$sha"
            latest=true
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$latest" >> "$GITHUB_OUTPUT"
          echo "already_validated=$already_validated" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate manually selected image source
    needs: resolve
    if: needs.resolve.outputs.already_validated != 'true'
    uses: ./.github/workflows/release-validation.yml
    with:
      source_ref: ${{ needs.resolve.outputs.sha }}

  publish:
    name: Publish ${{ matrix.variant }} image
    needs: [resolve, validate]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.validate.result == 'success' || (needs.validate.result == 'skipped' && needs.resolve.outputs.already_validated == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Locate Dockerfile in the selected source
        id: dockerfile
        env:
          CURRENT_PATH: ${{ matrix.dockerfile }}
          LEGACY_PATH: ${{ matrix.legacy_dockerfile }}
        run: |
          # Manual builds can select a release from before the source-layout move.
          path="$CURRENT_PATH"
          if [[ ! -f "$path" ]]; then path="$LEGACY_PATH"; fi
          test -f "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Prepare image metadata
        id: metadata
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_CHANNEL: ${{ needs.resolve.outputs.image_channel }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          PUBLISH_LATEST: ${{ needs.resolve.outputs.publish_latest }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          repo="ghcr.io/${OWNER,,}/jotist"
          tags="${repo}:${IMAGE_CHANNEL}${SUFFIX}-${SHORT_SHA}"
          # The rolling dev alias moves only after a successful build and a fresh main check.
          if [[ "$IMAGE_CHANNEL" != dev ]]; then tags="${repo}:${IMAGE_CHANNEL}${SUFFIX}"$'\n'"${tags}"; fi
          if [[ "$PUBLISH_LATEST" == true ]]; then tags="${tags}"$'\n'"${repo}:latest${SUFFIX}"; fi
          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            printf '%s\n' "$tags"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            VERSION=${{ needs.resolve.outputs.image_channel }}
            COMMIT=${{ needs.resolve.outputs.sha }}
            DATE=${{ steps.metadata.outputs.date }}
          labels: |
            org.opencontainers.image.title=Jotist
            org.opencontainers.image.description=Self-hosted audio transcription, derived from Scriberr
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.image_channel }}

      - name: Promote current main to the development alias
        if: needs.resolve.outputs.image_channel == 'dev'
        env:
          REPOSITORY: ${{ steps.metadata.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ needs.resolve.outputs.sha }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$main_sha" != "$REVISION" ]]; then
            echo "Main moved; keeping the commit image without changing the development alias." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create --prefer-index=false \
            --metadata-file promoted-image.json \
            --tag "${REPOSITORY}:dev${SUFFIX}" "${REPOSITORY}@${DIGEST}"
          test "$(jq -r '."containerimage.descriptor".digest' promoted-image.json)" = "$DIGEST"
          echo "Development alias: \`${REPOSITORY}:dev${SUFFIX}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Record immutable deployment reference
        env:
          REPOSITORY: ${{ steps.metadata.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ needs.resolve.outputs.sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "### Jotist $VARIANT" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$REPOSITORY@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: \`$REVISION\`" >> "$GITHUB_STEP_SUMMARY"
