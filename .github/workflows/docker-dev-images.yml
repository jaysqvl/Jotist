name: Publish container images

# No tag-push trigger: legacy tag imports cannot publish images.
on:
  workflow_call:
    inputs:
      source_repository:
        description: Must be this repository.
        required: true
        type: string
      upstream_ref:
        description: Source branch, tag, or commit.
        required: true
        type: string
      image_channel:
        description: Container tag without a leading v.
        required: true
        type: string
      variants:
        default: cpu-cuda
        type: string
      publish_latest:
        default: false
        type: boolean
      validated_source_sha:
        description: Exact commit already validated by the calling release workflow; omit to run validation here.
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      source_repository:
        description: Must be this repository.
        required: true
        default: jaysqvl/Jotist
        type: string
      upstream_ref:
        description: Source branch, tag, or commit.
        required: true
        default: main
        type: string
      image_channel:
        description: Container tag without a leading v, such as 1.7.0.
        required: true
        default: preview
        type: string
      variants:
        required: true
        default: cpu-cuda
        type: choice
        options: [cpu-cuda, cpu, cuda, blackwell, all]
      publish_latest:
        description: Update latest only for a matching stable version tag.
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: jotist-images-${{ inputs.image_channel }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve immutable image source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      short_sha: ${{ steps.source.outputs.short_sha }}
      image_channel: ${{ steps.settings.outputs.image_channel }}
      matrix: ${{ steps.settings.outputs.matrix }}
      publish_latest: ${{ steps.source.outputs.publish_latest }}
      already_validated: ${{ steps.source.outputs.already_validated }}
    steps:
      - name: Validate build inputs
        id: settings
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          IMAGE_CHANNEL: ${{ inputs.image_channel }}
          VARIANTS: ${{ inputs.variants }}
        run: |
          if [[ "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Jotist images must be built from this repository."
            exit 1
          fi
          if [[ ! "$IMAGE_CHANNEL" =~ ^[a-z0-9_][a-z0-9_.-]{0,79}$ || "$IMAGE_CHANNEL" == latest ]]; then
            echo "::error::Use a lowercase version or preview channel, not latest."
            exit 1
          fi
          case "$VARIANTS" in all|cpu-cuda|cpu|cuda|blackwell) ;; *) exit 1 ;; esac
          matrix='[{"variant":"cpu","dockerfile":"deploy/docker/Dockerfile.cpu","suffix":""},{"variant":"cuda","dockerfile":"deploy/docker/Dockerfile.cuda","suffix":"-cuda"},{"variant":"blackwell","dockerfile":"deploy/docker/Dockerfile.blackwell","suffix":"-blackwell"}]'
          matrix="$(jq -c --arg variant "$VARIANTS" '{include: map(select($variant == "all" or .variant == $variant or ($variant == "cpu-cuda" and (.variant == "cpu" or .variant == "cuda"))))}' <<< "$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "image_channel=$IMAGE_CHANNEL" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.upstream_ref }}
          fetch-depth: 0

      - name: Guard source and stable aliases
        id: source
        shell: bash
        env:
          VALIDATED_SHA: ${{ inputs.validated_source_sha }}
          IMAGE_CHANNEL: ${{ steps.settings.outputs.image_channel }}
          INPUT_LATEST: ${{ inputs.publish_latest }}
        run: |
          sha="$(git rev-parse HEAD)"
          already_validated=false
          if [[ -n "$VALIDATED_SHA" ]]; then
            if [[ ! "$VALIDATED_SHA" =~ ^[0-9a-f]{40}$ || "$VALIDATED_SHA" != "$sha" ]]; then
              echo "::error::Image source differs from the validated release commit."
              exit 1
            fi
            already_validated=true
          fi
          latest=false
          if [[ "$INPUT_LATEST" == true && "$IMAGE_CHANNEL" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            test "$(git rev-parse "refs/tags/v${IMAGE_CHANNEL}^{commit}")" = "$sha"
            latest=true
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$latest" >> "$GITHUB_OUTPUT"
          echo "already_validated=$already_validated" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate manually selected image source
    needs: resolve
    if: needs.resolve.outputs.already_validated != 'true'
    uses: ./.github/workflows/release-validation.yml
    with:
      source_ref: ${{ needs.resolve.outputs.sha }}

  qualify:
    name: Qualify ${{ matrix.variant }} candidate
    needs: [resolve, validate]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.validate.result == 'success' || (needs.validate.result == 'skipped' && needs.resolve.outputs.already_validated == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Require the current qualification contract
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          test -f "$DOCKERFILE"
          test -f scripts/smoke_container.py
          mkdir -p qualification

      - name: Prepare image metadata
        id: metadata
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_CHANNEL: ${{ needs.resolve.outputs.image_channel }}
          REVISION: ${{ needs.resolve.outputs.sha }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          repo="ghcr.io/${OWNER,,}/jotist"
          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "candidate=${repo}:candidate-${REVISION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish isolated candidate with SBOM and build provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          no-cache-filters: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.candidate }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ needs.resolve.outputs.image_channel }}
            COMMIT=${{ needs.resolve.outputs.sha }}
            DATE=${{ steps.metadata.outputs.date }}
          labels: |
            org.opencontainers.image.title=Jotist
            org.opencontainers.image.description=Jotist self-hosted audio transcription
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.image_channel }}
            io.jotist.image.variant=${{ matrix.variant }}

      - name: Pull and boot the exact published image
        env:
          REPOSITORY: ${{ steps.metadata.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ needs.resolve.outputs.sha }}
          IMAGE_CHANNEL: ${{ needs.resolve.outputs.image_channel }}
          VARIANT: ${{ matrix.variant }}
        run: |
          docker pull "${REPOSITORY}@${DIGEST}"
          python3 scripts/smoke_container.py --image "${REPOSITORY}@${DIGEST}" \
            --revision "$REVISION" --version "$IMAGE_CHANNEL" --report "qualification/smoke-${VARIANT}.json"

      - name: Record unfiltered exact image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ steps.metadata.outputs.repository }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0' # The strict gate below applies the reviewed package scope.
          list-all-pkgs: true
          format: json
          output: qualification/trivy-${{ matrix.variant }}-raw.json

      - name: Enforce exact image vulnerability gate with verified package applicability
        env:
          IMAGE: ${{ steps.metadata.outputs.repository }}@${{ steps.build.outputs.digest }}
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 scripts/prepare_container_vex.py \
            --report "qualification/trivy-${VARIANT}-raw.json" --smoke "qualification/smoke-${VARIANT}.json" \
            --output qualification/kernel-headers.openvex.json
          trivy image "$IMAGE" --cache-dir .cache/trivy --skip-db-update \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed=false --exit-code 1 \
            --vex qualification/kernel-headers.openvex.json \
            --format json --output "qualification/trivy-${VARIANT}.json"

      # Sign only after the exact image has passed its packaging and vulnerability gates.
      - name: Attest qualified image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.metadata.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify signature and record qualification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ steps.metadata.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ needs.resolve.outputs.sha }}
          VARIANT: ${{ matrix.variant }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          gh attestation verify "oci://${REPOSITORY}@${DIGEST}" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/docker-dev-images.yml" \
            --deny-self-hosted-runners
          jq -n --arg repository "$REPOSITORY" --arg digest "$DIGEST" --arg revision "$REVISION" \
            --arg variant "$VARIANT" --arg suffix "$SUFFIX" \
            '{repository:$repository,digest:$digest,revision:$revision,variant:$variant,suffix:$suffix}' \
            > "qualification/qualified-${VARIANT}.json"

      - name: Retain per-variant qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-image-${{ matrix.variant }}
          path: qualification/
          retention-days: 30

  promote:
    name: Promote all qualified variants
    needs: [resolve, qualify]
    # Reused validation is intentionally skipped; ignore that ancestor's implicit
    # success() gate while still requiring every requested variant to qualify.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.qualify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: published-image-*
          path: qualification
          merge-multiple: true
      - name: Verify every requested variant before moving any alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX: ${{ needs.resolve.outputs.matrix }}
          REVISION: ${{ needs.resolve.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repo="ghcr.io/${OWNER,,}/jotist"
          while IFS=$'\t' read -r variant suffix; do
            file="qualification/qualified-${variant}.json"
            jq -e --arg repo "$repo" --arg revision "$REVISION" --arg variant "$variant" --arg suffix "$suffix" \
              '.repository == $repo and .revision == $revision and .variant == $variant and .suffix == $suffix and (.digest | test("^sha256:[0-9a-f]{64}$"))' "$file"
            digest="$(jq -r .digest "$file")"
            gh attestation verify "oci://${repo}@${digest}" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/docker-dev-images.yml" \
              --deny-self-hosted-runners
          done < <(jq -r '.include[] | [.variant,.suffix] | @tsv' <<< "$MATRIX")
      - name: Promote verified digests
        env:
          IMAGE_CHANNEL: ${{ needs.resolve.outputs.image_channel }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          REVISION: ${{ needs.resolve.outputs.sha }}
          PUBLISH_LATEST: ${{ needs.resolve.outputs.publish_latest }}
          MATRIX: ${{ needs.resolve.outputs.matrix }}
        run: |
          if [[ "$IMAGE_CHANNEL" == dev && "$(git ls-remote origin refs/heads/main | cut -f1)" != "$REVISION" ]]; then
            echo "Main moved; qualified candidates are retained without changing development aliases." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while IFS=$'\t' read -r variant suffix; do
            file="qualification/qualified-${variant}.json"
            repo="$(jq -r .repository "$file")"
            digest="$(jq -r .digest "$file")"
            tags=(--tag "${repo}:${IMAGE_CHANNEL}${suffix}-${SHORT_SHA}" --tag "${repo}:${IMAGE_CHANNEL}${suffix}")
            # Blackwell packaging is tested, but actual Blackwell inference is still unqualified.
            if [[ "$PUBLISH_LATEST" == true && "$variant" != blackwell ]]; then tags+=(--tag "${repo}:latest${suffix}"); fi
            docker buildx imagetools create --prefer-index=false --metadata-file promoted-image.json \
              "${tags[@]}" "${repo}@${digest}"
            test "$(jq -r '."containerimage.descriptor".digest' promoted-image.json)" = "$digest"
            echo "### Jotist ${variant}" >> "$GITHUB_STEP_SUMMARY"
            echo "Image: \`${repo}@${digest}\` · source: \`${REVISION}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Packaging, vulnerability scan, SBOM and signed provenance verified. CUDA inference requires separate hardware qualification." >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.include[] | [.variant,.suffix] | @tsv' <<< "$MATRIX")

  complete:
    name: Require completed image promotion
    needs: [resolve, qualify, promote]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require source, qualification and promotion success
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["RESULTS"])
          if set(results) != {"resolve", "qualify", "promote"}:
              raise SystemExit("Image publication prerequisites are incomplete")
          for job, details in results.items():
              if details["result"] != "success":
                  raise SystemExit(f"Image publication incomplete: {job}={details['result']}")
          PY
