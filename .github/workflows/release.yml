name: Release

# Explicit publication only. Importing historical Scriberr tags never releases them.
on:
  workflow_call:
    inputs:
      tag:
        description: Existing Jotist version tag to release.
        required: true
        type: string
      variants:
        description: Container variants to publish after artifact validation.
        default: cpu-cuda
        type: string
      publish_latest:
        description: Update latest aliases for a stable release only.
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.7.0.
        required: true
        type: string
      variants:
        description: Container variants to publish.
        default: cpu-cuda
        required: true
        type: choice
        options: [cpu-cuda, cpu, cuda, blackwell, all]
      publish_latest:
        description: Update latest aliases (ignored for prereleases).
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve immutable release source
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish_latest: ${{ steps.version.outputs.publish_latest }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate release inputs
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VARIANTS: ${{ inputs.variants }}
          INPUT_LATEST: ${{ inputs.publish_latest }}
        run: |
          if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Use a version tag such as v1.7.0 or a new prerelease version."
            exit 1
          fi
          case "$INPUT_VARIANTS" in all|cpu-cuda|cpu|cuda|blackwell) ;; *) exit 1 ;; esac
          latest=false
          if [[ "$INPUT_LATEST" == true && "$INPUT_TAG" != *-* ]]; then latest=true; fi
          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${INPUT_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$latest" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Capture and check release source
        id: source
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate release source
    needs: resolve
    uses: ./.github/workflows/release-validation.yml
    with:
      source_ref: ${{ needs.resolve.outputs.sha }}

  artifacts:
    name: Publish release artifacts
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Guard the validated commit
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Publish validated release images
    needs: [resolve, validate, artifacts]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-dev-images.yml
    with:
      source_repository: ${{ github.repository }}
      upstream_ref: ${{ needs.resolve.outputs.sha }}
      image_channel: ${{ needs.resolve.outputs.version }}
      variants: ${{ inputs.variants }}
      publish_latest: ${{ needs.resolve.outputs.publish_latest == 'true' }}
      validated_source_sha: ${{ needs.resolve.outputs.sha }}
    secrets: inherit
