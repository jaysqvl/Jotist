name: Python Adapter Import Checks

on:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable source commit to qualify for release.
        required: true
        type: string
      adapter:
        description: Adapter to qualify; releases run all.
        default: all
        type: string
  pull_request:
    paths:
      - 'internal/transcription/adapters/**'
      - 'scripts/*python*'
      - 'scripts/python-adapter-audit-policy.json'
      - '.github/workflows/python-adapter-imports.yml'
  workflow_dispatch:
    inputs:
      adapter:
        description: Adapter import check to run on Python 3.12
        required: true
        default: all
        type: choice
        options:
          - all
          - canary-qwen
          - nvidia-asr
          - pyannote
          - whisperx
          - local-asr
          - suplime
          - diarizen

permissions:
  contents: read

jobs:
  runtime-contracts:
    name: Shared worker and output contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Test shared controls and native output recovery
        run: uv run --no-project --python 3.12 --with numpy --with pytest python -m pytest -q internal/transcription/adapters/py/local_asr/tests internal/transcription/adapters/py/nvidia/tests/test_canary_stages.py internal/transcription/adapters/py/nvidia/tests/test_nvidia_compat.py internal/transcription/adapters/py/test_runtime_controls.py internal/transcription/adapters/py/research/test_research_diarize.py internal/transcription/adapters/py/whisperx/test_vad_asset.py

  imports:
    name: import ${{ matrix.adapter }} on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        adapter: [nvidia-asr, canary-qwen, pyannote, whisperx, local-asr, suplime, diarizen]
        python-version: ['3.12']
        include:
          - {adapter: pyannote, python-version: '3.10'}
    steps:
      - name: Checkout code
        if: github.event_name != 'workflow_dispatch' || inputs.adapter == 'all' || inputs.adapter == matrix.adapter
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Setup Python
        if: github.event_name != 'workflow_dispatch' || inputs.adapter == 'all' || inputs.adapter == matrix.adapter
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup uv
        if: github.event_name != 'workflow_dispatch' || inputs.adapter == 'all' || inputs.adapter == matrix.adapter
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install native audio decoder libraries
        if: github.event_name != 'workflow_dispatch' || inputs.adapter == 'all' || inputs.adapter == matrix.adapter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Setup Go for real CPU inference
        if: matrix.adapter == 'whisperx' && (github.event_name != 'workflow_dispatch' || inputs.adapter == 'all' || inputs.adapter == matrix.adapter)
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build shared runtime qualification test
        if: matrix.adapter == 'whisperx' && (github.event_name != 'workflow_dispatch' || inputs.adapter == 'all' || inputs.adapter == matrix.adapter)
        run: go test -c ./internal/transcription/adapters -o /tmp/jotist-runtime.test

      - name: Import adapter, decode audio and qualify shared CPU inference
        if: github.event_name != 'workflow_dispatch' || inputs.adapter == 'all' || inputs.adapter == matrix.adapter
        env:
          ADAPTER: ${{ matrix.adapter }}
          ADAPTER_PYTHON: ${{ matrix.python-version }}
        run: |
          inference=()
          if [ "$ADAPTER" = "whisperx" ]; then
            inference=(--inference-smoke-binary /tmp/jotist-runtime.test)
          fi
          python scripts/verify-python-adapter-envs.py --mode import --torch-index cpu --python "$ADAPTER_PYTHON" --adapter "$ADAPTER" --audit --audit-output-dir artifacts/python-audit "${inference[@]}"

      - name: Preserve installed dependency audit
        if: always() && hashFiles('artifacts/python-audit/*.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-audit-${{ matrix.adapter }}-${{ matrix.python-version }}
          path: artifacts/python-audit/*.json
          retention-days: 30
