name: Python Adapter Import Checks

on:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable source commit to qualify for release.
        required: true
        type: string
      adapter:
        description: Adapter to qualify; releases run all.
        default: all
        type: string
  workflow_dispatch:
    inputs:
      adapter:
        description: Adapter import check to run on Python 3.12
        required: true
        default: all
        type: choice
        options:
          - all
          - canary-qwen
          - nvidia-asr
          - pyannote
          - whisperx
          - local-asr
          - suplime
          - diarizen
          - model-downloads

permissions:
  contents: read

jobs:
  runtime-contracts:
    name: Shared worker and output contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Test shared controls and native output recovery
        run: uv run --no-project --python 3.12 --with numpy --with pytest python -m pytest -q internal/transcription/adapters/py/local_asr/tests internal/transcription/adapters/py/nvidia/tests/test_canary_stages.py internal/transcription/adapters/py/nvidia/tests/test_nvidia_compat.py internal/transcription/adapters/py/test_runtime_controls.py internal/transcription/adapters/py/research/test_research_diarize.py internal/transcription/adapters/py/whisperx/test_vad_asset.py
      - name: Test model file downloads without an inference runtime
        run: uv run --project internal/transcription/adapters/py/model_downloads --python 3.12 python -I -m unittest discover -s internal/transcription/adapters/py/model_downloads -p test_download.py -v

  imports:
    name: import ${{ matrix.adapter }} on Python ${{ matrix.python-version }} (${{ matrix.architecture }})
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        adapter: [nvidia-asr, canary-qwen, pyannote, whisperx, local-asr, suplime, diarizen, model-downloads]
        python-version: ['3.12']
        architecture: [amd64, arm64]
        include:
          - {adapter: pyannote, python-version: '3.11', architecture: amd64}
          - {adapter: model-downloads, python-version: '3.11', architecture: amd64}
    steps:
      - name: Checkout code
        if: github.event_name != 'workflow_dispatch' || inputs.adapter == 'all' || inputs.adapter == matrix.adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Require native architecture
        if: github.event_name != 'workflow_dispatch' || inputs.adapter == 'all' || inputs.adapter == matrix.adapter
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 -c 'import os,platform; expected={"amd64":"x86_64","arm64":"aarch64"}[os.environ["EXPECTED_ARCHITECTURE"]]; assert platform.machine()==expected, "runtime checks must run natively"'

      - name: Setup Python
        if: github.event_name != 'workflow_dispatch' || inputs.adapter == 'all' || inputs.adapter == matrix.adapter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Setup uv
        if: github.event_name != 'workflow_dispatch' || inputs.adapter == 'all' || inputs.adapter == matrix.adapter
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install native audio decoder libraries
        if: github.event_name != 'workflow_dispatch' || inputs.adapter == 'all' || inputs.adapter == matrix.adapter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Setup Go for real CPU inference
        if: (matrix.adapter == 'whisperx' || matrix.adapter == 'diarizen' || (matrix.adapter == 'model-downloads' && matrix.python-version == '3.12')) && (github.event_name != 'workflow_dispatch' || inputs.adapter == 'all' || inputs.adapter == matrix.adapter)
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build shared runtime qualification test
        if: (matrix.adapter == 'whisperx' || matrix.adapter == 'diarizen' || (matrix.adapter == 'model-downloads' && matrix.python-version == '3.12')) && (github.event_name != 'workflow_dispatch' || inputs.adapter == 'all' || inputs.adapter == matrix.adapter)
        run: go test -c ./internal/transcription/adapters -o /tmp/jotist-runtime.test

      - name: Import adapter, decode audio and qualify shared CPU inference
        if: github.event_name != 'workflow_dispatch' || inputs.adapter == 'all' || inputs.adapter == matrix.adapter
        env:
          ADAPTER: ${{ matrix.adapter }}
          ADAPTER_PYTHON: ${{ matrix.python-version }}
        run: |
          inference=()
          if [ "$ADAPTER" = "whisperx" ] || [ "$ADAPTER" = "diarizen" ]; then
            inference=(--inference-smoke-binary /tmp/jotist-runtime.test --inference-output-dir artifacts/runtime-inference)
          fi
          python scripts/verify-python-adapter-envs.py --mode import --torch-index cpu --python "$ADAPTER_PYTHON" --adapter "$ADAPTER" --audit --audit-output-dir artifacts/python-audit "${inference[@]}"

      - name: Qualify manual prefetch and offline cache reuse
        if: matrix.adapter == 'model-downloads' && matrix.python-version == '3.12' && (github.event_name != 'workflow_dispatch' || inputs.adapter == 'all' || inputs.adapter == matrix.adapter)
        env:
          JOTIST_MODEL_DOWNLOAD_SMOKE: '1'
        run: /tmp/jotist-runtime.test -test.run '^TestManualModelDownloadQualification$' -test.v -test.timeout=5m

      - name: Preserve installed dependency audit
        if: always() && hashFiles('artifacts/python-audit/*.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-audit-${{ matrix.adapter }}-${{ matrix.python-version }}-${{ matrix.architecture }}
          path: artifacts/python-audit/*.json
          retention-days: 30

      - name: Preserve actual inference evidence
        if: always() && hashFiles('artifacts/runtime-inference/*.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-inference-${{ matrix.adapter }}-${{ matrix.python-version }}-${{ matrix.architecture }}
          path: artifacts/runtime-inference/*.json
          retention-days: 30
