name: Validate release source

on:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable source commit to validate.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Frontend and backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Validate and build frontend
        working-directory: web/frontend
        run: npm ci && npm audit && npm test && npm run lint && npm run type-check && npm run build

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Embed validated frontend
        run: make embed

      - name: Vet and test backend
        run: |
          go vet ./api-docs ./cmd/... ./internal/... ./pkg/... ./tests
          go test ./api-docs ./cmd/... ./internal/... ./pkg/... ./tests

      - name: Scan Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./cmd/... ./internal/... ./pkg/...

  python-adapter-envs:
    name: Python adapter environments (${{ matrix.python-version }}, ${{ matrix.torch-index }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        torch-index: ['cpu', 'cu126', 'cu130']
        include:
          - {python-version: '3.10', torch-index: cpu}
          - {python-version: '3.10', torch-index: cu126}
          - {python-version: '3.10', torch-index: cu130}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12' # Verifier uses tomllib; uv selects the target runtime below.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Test runtime verifier policy
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Verify Python adapter resolver surfaces
        env:
          ADAPTER_PYTHON: ${{ matrix.python-version }}
          TORCH_INDEX: ${{ matrix.torch-index }}
        run: |
          adapters=()
          if [ "$ADAPTER_PYTHON" = "3.10" ]; then
            adapters=(--adapter pyannote)
          elif [ "$ADAPTER_PYTHON" = "3.11" ]; then
            # DiariZen requires Python 3.12 after the coordinated runtime update.
            for adapter in nvidia-asr canary-qwen pyannote whisperx suplime local-asr; do
              adapters+=(--adapter "$adapter")
            done
          fi
          python scripts/verify-python-adapter-envs.py --mode lock --python "$ADAPTER_PYTHON" --torch-index "$TORCH_INDEX" "${adapters[@]}"

  python-runtime-imports:
    name: Installed Python runtime qualification
    uses: ./.github/workflows/python-adapter-imports.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      adapter: all
