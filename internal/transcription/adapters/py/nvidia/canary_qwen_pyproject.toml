[project]
name = "nvidia-canary-qwen-transcription"
version = "0.1.0"
description = "Audio transcription using NVIDIA Canary-Qwen"
requires-python = ">=3.11,<3.13"
dependencies = [
    "nemo-toolkit[asr,tts]",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.57.6",
    "peft==0.17.1",
    "librosa",
    "soundfile",
    "numpy",
    "ml-dtypes>=0.5.0,<0.6.0",
    "onnx>=1.18.0,<1.20.0",
    "sacrebleu",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.uv.sources]
nemo-toolkit = { git = "https://github.com/NVIDIA/NeMo.git", tag = "v2.7.3" }
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]
triton = [
    { index = "pytorch", marker = "sys_platform == 'linux'" }
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
