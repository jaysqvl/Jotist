[project]
name = "nvidia-canary-qwen-transcription"
version = "0.1.0"
description = "Audio transcription using NVIDIA Canary-Qwen"
requires-python = ">=3.11,<3.13"
dependencies = [
    # HF-backed SALM uses ASR/TTS plus PEFT. The speechlm2 extra also installs
    # unused Automodel/FlashOptim backends and pins older Transformers/PEFT.
    "nemo-toolkit[asr,tts]==3.0.0",
    "torch==2.14.0",
    "torchaudio==2.11.0",
    "torchcodec==0.16.0",
    "transformers==5.17.0",
    "huggingface-hub==1.31.0",
    "peft==0.20.0",
    "lightning==2.6.6",
    "pytorch-lightning==2.6.6",
    "hydra-core==1.3.6",
    "nltk==3.10.3",
    "nv-one-logger-pytorch-lightning-integration==2.3.1+jotist.1",
    "librosa",
    "soundfile",
    "numba-cuda[cu12]==0.30.4; sys_platform == 'linux'",
    "cuda-python>=12,<13; sys_platform == 'linux'",
    "numpy",
    "ml-dtypes==0.6.0",
    "onnx==1.22.0",
    "sacrebleu",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.uv]
# NeMo 3.0's training-era upper bounds select vulnerable Lightning <=2.4.0
# and Hydra <=1.3.2. This inference compatibility port changes only those
# bounds: Lightning 2.6.6 fixes CVE-2026-58659/CVE-2026-31221; Hydra >=1.3.4
# fixes CVE-2026-68508. Keep the official NeMo wheel and strict source hashes.
# Changes require the real ASR/SALM and Canary checkpoint qualification suite.
override-dependencies = ["lightning==2.6.6", "hydra-core==1.3.6"]

[tool.uv.sources]
nv-one-logger-pytorch-lightning-integration = { path = "vendor/nv-one-logger-pytorch-lightning-integration" }
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]
torchcodec = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]
triton = [
    { index = "pytorch", marker = "sys_platform == 'linux'" }
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
