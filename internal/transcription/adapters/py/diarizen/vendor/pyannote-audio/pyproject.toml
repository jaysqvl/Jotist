[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "pyannote.audio"
version = "3.1.1+jotist.1"
description = "DiariZen's custom pyannote.audio fork at upstream 844f555"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE", "pyannote/audio/models/embedding/wespeaker/LICENSE.WeSpeaker"]
dependencies = [
    "asteroid-filterbanks>=0.4",
    "einops>=0.8",
    "huggingface-hub>=1.31,<2",
    "lightning>=2.6.6,<3",
    "matplotlib>=3.10,<4",
    "omegaconf>=2.1,<3",
    "pyannote.core==6.0.1",
    "pyannote.database==6.1.1",
    "pyannote.metrics==4.1",
    "pyannote.pipeline==4.0.0",
    "pytorch-metric-learning>=2.9",
    "rich>=12",
    "semver>=3",
    "soundfile>=0.14",
    "speechbrain>=1.1.1,<2",
    "tensorboardX>=2.6",
    "torch>=2.14,<3",
    "torch-audiomentations>=0.12,<1",
    "torchaudio>=2.11,<3",
    "torchmetrics>=1.9,<2",
]

[tool.setuptools.packages.find]
include = ["pyannote*"]

[tool.setuptools.package-data]
"pyannote.audio" = ["sample/*", "cli/**/*.yaml", "models/embedding/wespeaker/LICENSE.WeSpeaker"]
