[project]
name = "scriberr-diarizen"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "diarizen",
    "pyannote.audio",
    "torch==2.14.0",
    "torchaudio==2.11.0",
    "torchcodec==0.16.0",
    "numpy>=2.2.2,<3",
    "huggingface-hub==1.31.0",
    "accelerate==1.15.0",
    "transformers==5.17.0",
    "speechbrain==1.1.1",
    "lightning==2.6.6",
    "torchmetrics==1.9.0",
    "torch-audiomentations==0.12.0",
    "librosa==1.0.0",
    "soundfile==0.14.0",
    "toml",
    "torchinfo",
    "thop",
    "h5py",
]

# Both vendored packages retain the same reviewed upstream source revision.
# See vendor/README.md and each package's UPSTREAM.json for compatibility changes.
[tool.uv.sources]
diarizen = { path = "vendor/diarizen", editable = true }
"pyannote.audio" = { path = "vendor/pyannote-audio", editable = true }

torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]
torchcodec = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
