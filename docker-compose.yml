# Jotist CPU image. See deploy/README.md for GPU and source-build configurations.
services:
  jotist:
    image: ghcr.io/jaysqvl/jotist:latest
    ports:
      - "8080:8080"
    volumes:
      - jotist_data:/app/data
      - env_data:/app/whisperx-env
    environment:
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/jotist.db}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Security: already set in container, but can be overridden
      - APP_ENV=production
      # CORS: comma-separated list of allowed origins for production
      # - ALLOWED_ORIGINS=https://your-domain.com
    restart: unless-stopped

volumes:
  jotist_data: {}
  env_data: {}
